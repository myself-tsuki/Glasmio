name: GitHub Release
# Builds every library and attaches the AARs plus a local Maven repository zip to a GitHub release.
# No Maven Central credentials are needed. Run it from the Actions tab, or push a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v1.0.1)
        required: true
        default: v1.0.0
      prerelease:
        description: Mark as pre-release
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Test and publish to a local repository
        run: ./gradlew testDebugUnitTest publishAllPublicationsToStagingRepository --console=plain
      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp -r build/maven dist/maven-repository
          (cd dist && zip -qr glasmio-maven-repository.zip maven-repository)
          find build/maven -name '*.aar' -exec cp {} dist/ \;
          ls -la dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRE: ${{ github.event.inputs.prerelease }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Glasmio $TAG" \
              --notes-file CHANGELOG.md $( [ "$PRE" = "true" ] && echo --prerelease )
          fi
          gh release upload "$TAG" dist/*.aar dist/glasmio-maven-repository.zip --clobber
